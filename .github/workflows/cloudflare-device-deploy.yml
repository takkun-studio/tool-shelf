name: One-time Cloudflare device deploy
on:
  push:
    branches: [main]
    paths:
      - 'ops/cloudflare-device-deploy.trigger'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Cloudflare device authorization and publish approval link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 login --device --browser=false > /tmp/wrangler-login.log 2>&1 &
          login_pid=$!

          for i in $(seq 1 45); do
            if grep -q 'dash.cloudflare.com/oauth2/device' /tmp/wrangler-login.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              cat /tmp/wrangler-login.log
              exit 1
            fi
            sleep 1
          done

          auth_lines=$(grep -E 'dash.cloudflare.com/oauth2/device|enter the code|^[[:space:]]+[A-Za-z0-9_-]{6,}[[:space:]]*$' /tmp/wrangler-login.log | head -8 || true)
          if [ -z "$auth_lines" ]; then
            cat /tmp/wrangler-login.log
            echo "::error::Cloudflare device authorization URL was not produced."
            kill "$login_pid" 2>/dev/null || true
            exit 1
          fi

          body=$(printf 'Cloudflare本番反映の本人確認です。\n\n```\n%s\n```\n\nこのコードは短時間で失効します。Cloudflareで許可すると、この実行がD1追加→Worker更新→公開API確認まで続行します。' "$auth_lines")
          gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" -f body="$body" >/dev/null

          wait "$login_pid"

      - name: Confirm authenticated Cloudflare account
        run: npx --yes wrangler@4.119.0 whoami

      - name: Add only the PRO selection table to existing D1
        run: npx --yes wrangler@4.119.0 d1 execute tool-shelf-entitlements --remote --file=worker/migrations/0003_pro_selections.sql

      - name: Verify PRO table without reading user data
        run: npx --yes wrangler@4.119.0 d1 execute tool-shelf-entitlements --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='pro_selections';"

      - name: Deploy existing Tool Shelf Worker
        run: npx --yes wrangler@4.119.0 deploy

      - name: Verify new Worker endpoint
        shell: bash
        run: |
          body_file="$(mktemp)"
          status=$(curl --silent --show-error --location --output "$body_file" --write-out '%{http_code}' --max-time 20 \
            --header 'Origin: https://takkun-tool-shelf.pages.dev' \
            'https://tool-shelf-api.gszknw599m.workers.dev/v1/pro/status')
          cat "$body_file"
          echo "HTTP $status"
          test "$status" = "401"

      - name: Report backend deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" \
            -f body="Cloudflare backend反映完了。D1 pro_selections追加、tool-shelf-api更新、/v1/pro/status の未認証401を確認済み。" >/dev/null
