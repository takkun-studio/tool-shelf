<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原価・利益計算 PRO</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182536;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#162b47;color:white;padding:22px max(18px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#c9d7e7}main{max-width:1050px;margin:25px auto;padding:0 15px}.panel{background:white;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 2px 15px #20314b0b}h2{font-size:18px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:650}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin-top:5px}button{border:0;border-radius:8px;padding:11px 14px;background:#2357a6;color:white;cursor:pointer;font-weight:700}button.secondary{background:#e8eef6;color:#183658}button.danger{background:#fbe9e9;color:#a32020}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f1f6fd;border-radius:10px;padding:14px}.metric small{display:block;color:#52657d}.metric strong{display:block;font-size:21px;margin-top:5px;overflow-wrap:anywhere}.bad{color:#b42318}.good{color:#126a3a}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;border-bottom:1px solid #e6eaf0;padding:11px}th{font-size:12px;color:#52657d}td button{padding:7px 10px}.scroll{overflow:auto}.note{font-size:12px;color:#52657d;line-height:1.7}.error{color:#b42318;min-height:1.3em}#printTitle{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media print{header,.actions,.no-print,#formPanel{display:none!important}main{margin:0;max-width:none}.panel{box-shadow:none}#printTitle{display:block}}
</style></head><body><header><h1>原価・利益計算 PRO</h1><p>商品別の利益・手数料・目標利益からの売価逆算まで。オフラインで使える買い切りツール。</p></header><main><section class="panel" id="formPanel"><h2>商品を登録・編集</h2><div class="grid"><label>商品名<input id="name" placeholder="例：ハンドメイドポーチ" maxlength="100"></label><label>販売価格（円）<input id="price" type="number" min="0" step="0.01" value="2000"></label><label>商品原価（円）<input id="cost" type="number" min="0" step="0.01" value="700"></label><label>送料（円）<input id="shipping" type="number" min="0" step="0.01" value="200"></label><label>販売手数料率（%）<input id="feeRate" type="number" min="0" max="100" step="0.01" value="10"></label><label>固定手数料（円）<input id="fixedFee" type="number" min="0" step="0.01" value="0"></label><label>その他経費（円）<input id="other" type="number" min="0" step="0.01" value="0"></label><label>目標利益（円）<input id="target" type="number" min="0" step="0.01" value="1000"></label></div><div class="actions"><button id="save">商品を保存</button><button class="secondary" id="reset">新規入力に戻す</button></div><p id="error" class="error" role="alert"></p></section><section class="panel"><h2>計算結果</h2><div class="metrics"><div class="metric"><small>利益</small><strong id="profit">-</strong></div><div class="metric"><small>利益率</small><strong id="margin">-</strong></div><div class="metric"><small>総コスト</small><strong id="total">-</strong></div><div class="metric"><small>目標利益を得る最低売価</small><strong id="required">-</strong></div></div><p class="note" id="detail"></p></section><section class="panel"><h2>登録商品一覧・利益比較</h2><div class="actions no-print"><button class="secondary" id="export">CSVを書き出す</button><button class="secondary" id="importButton">CSVを読み込む</button><input id="importFile" type="file" accept=".csv,text/csv" hidden><button class="secondary" id="backup">JSONバックアップ</button><button class="secondary" id="restoreButton">JSON復元</button><input id="restoreFile" type="file" accept=".json,application/json" hidden><button class="secondary" id="print">PDF保存・印刷</button><button class="danger" id="clear">全件削除</button></div><p class="note">保存先はこのブラウザ内です。別端末へ移すときはCSVを書き出してください。CSV読み込みは既存データに追加されます。</p><div class="scroll"><table><thead><tr><th>商品</th><th>売価</th><th>総コスト</th><th>利益</th><th>利益率</th><th class="no-print">操作</th></tr></thead><tbody id="items"></tbody></table></div><p id="summary" class="note"></p></section><p class="note">税金や決済時の端数処理は個別条件に応じて確認してください。計算は入力値を基にした概算です。外部サーバーへの送信はありません。</p></main><script>
'use strict';const KEY='profit-pro-v1';const FIELDS=['price','cost','shipping','feeRate','fixedFee','other','target'];const $=id=>document.getElementById(id);const yen=n=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:2}).format(n):'計算不可';const pct=n=>Number.isFinite(n)?n.toFixed(1)+'%':'計算不可';
function calc(x){const fee=x.price*x.feeRate/100+x.fixedFee;const total=x.cost+x.shipping+fee+x.other;const profit=x.price-total;const denom=1-x.feeRate/100;return {fee,total,profit,margin:x.price>0?profit/x.price*100:null,required:denom>0?Math.ceil((x.cost+x.shipping+x.fixedFee+x.other+x.target)/denom*100)/100:null};}
function valid(x){return FIELDS.every(k=>Number.isFinite(x[k])&&x[k]>=0&&x[k]<=1e12)&&(x.feeRate<=100)&&typeof x.name==='string'&&x.name.trim().length>0&&x.name.length<=100;}
let records=[];let editing=null;let storageRaw=null;let storageBlocked=false;function validateRecords(a){if(!Array.isArray(a)||a.length>5000)throw Error('保存データの件数が不正です');const ids=new Set();return a.map(x=>{if(!x||!valid(x)||typeof x.id!=='string'||!x.id||ids.has(x.id))throw Error('保存データの形式が不正です');ids.add(x.id);return {id:x.id,name:x.name,...Object.fromEntries(FIELDS.map(k=>[k,x[k]]))};});}try{storageRaw=localStorage.getItem(KEY);records=validateRecords(JSON.parse(storageRaw===null?'[]':storageRaw));}catch(e){storageBlocked=true;$('error').textContent='保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください。';}
function read(){const x={name:$('name').value.trim()};for(const k of FIELDS){const el=$(k);x[k]=el.value.trim()===''?NaN:Number(el.value);}return x;}
function fill(x){$('name').value=x.name;FIELDS.forEach(k=>$(k).value=x[k]);}
function update(){const x=read();if(FIELDS.some(k=>!Number.isFinite(x[k])||x[k]<0||x[k]>1e12)||x.feeRate>100){['profit','margin','total','required'].forEach(k=>$(k).textContent='入力確認');$('detail').textContent='金額は0以上、手数料率は0〜100%で入力してください。';return;}const c=calc(x);$('profit').textContent=yen(c.profit);$('profit').className=c.profit<0?'bad':'good';$('margin').textContent=pct(c.margin);$('total').textContent=yen(c.total);$('required').textContent=yen(c.required);$('detail').textContent=`販売手数料 ${yen(c.fee)} ／ 損益ゼロ売価 ${yen(calc({...x,target:0}).required)} ／ 目標利益との差 ${yen(c.profit-x.target)}。手数料率100%の場合、売価逆算はできません。`;}
function persist(next,allowRecovery=false){try{if(storageBlocked&&!allowRecovery)throw Error('保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください。');if(localStorage.getItem(KEY)!==storageRaw)throw Error('別の画面でデータが変更されました。再読み込みしてください。');const raw=JSON.stringify(validateRecords(next));localStorage.setItem(KEY,raw);storageRaw=raw;records=next;storageBlocked=false;return true;}catch(e){$('error').textContent=e.message||'保存できませんでした。';return false;}}
function render(){const body=$('items');body.replaceChildren();for(const x of records){const c=calc(x);const tr=document.createElement('tr');for(const s of [x.name,yen(x.price),yen(c.total),yen(c.profit),pct(c.margin)]){const td=document.createElement('td');td.textContent=s;tr.append(td);}const td=document.createElement('td');td.className='no-print';const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{editing=x.id;fill(x);update();window.scrollTo({top:0,behavior:'smooth'});};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm('この商品を削除しますか？')){if(persist(records.filter(y=>y.id!==x.id)))render();}};td.append(edit,' ',del);tr.append(td);body.append(tr);}const totalProfit=records.reduce((a,x)=>a+calc(x).profit,0);$('summary').textContent=`登録 ${records.length} 件 ／ 商品ごとの利益合計（各1個販売した場合） ${yen(totalProfit)}`;}
function newId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
$('save').onclick=()=>{const x=read();if(!valid(x)){$('error').textContent='商品名と数値を確認してください。金額は0以上、手数料率は0〜100%です。';return;}$('error').textContent='';x.id=editing||newId();const i=records.findIndex(y=>y.id===x.id);const next=records.slice();if(i>=0)next[i]=x;else next.push(x);if(persist(next)){editing=null;render();$('error').textContent='保存しました。';}};
$('reset').onclick=()=>{editing=null;$('name').value='';$('error').textContent='';update();};document.querySelectorAll('input[type=number]').forEach(el=>el.addEventListener('input',update));
function csvCell(v){let s=String(v??'');if(typeof v==='string'&&(/^[\t\r\n ]*[=+@-]/.test(s)||s.startsWith("'")))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
const HEAD=['name',...FIELDS],SAFE_HEAD=['name:csv-safe-v1',...FIELDS];$('export').onclick=()=>{const csv='\ufeff'+[SAFE_HEAD.join(','),...records.map(x=>HEAD.map(k=>csvCell(x[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='profit-pro-products.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
function parseCSV(t){t=t.replace(/^\ufeff/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<t.length;i++){const ch=t[i];if(quoted){if(ch==='"'&&t[i+1]==='"'){field+='"';i++;}else if(ch==='"')quoted=false;else field+=ch;}else if(ch==='"'){if(field!=='')throw Error('CSVの引用符が不正です');quoted=true;}else if(ch===','){row.push(field);field='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field='';}else field+=ch;}if(quoted)throw Error('CSVの引用符が閉じられていません');row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows;}
$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2_000_000)throw Error('CSVは2MB以下にしてください');const rows=parseCSV(await f.text());if(!rows.length)throw Error('このツールで書き出したCSVを選択してください');const safe=SAFE_HEAD.every((k,i)=>rows[0][i]===k);if(!safe&&HEAD.some((k,i)=>rows[0][i]!==k))throw Error('このツールで書き出したCSVを選択してください');if(rows.length>5001)throw Error('一度に読み込めるのは5000件までです');const added=rows.slice(1).map((r,i)=>{if(r.length!==HEAD.length)throw Error(`${i+2}行目の列数が不正です`);const encodedName=r[0],name=safe&&(/^''/.test(encodedName)||/^'[\t\r\n ]*[=+@-]/.test(encodedName))?encodedName.slice(1):encodedName;const x={name,id:newId()};FIELDS.forEach((k,j)=>x[k]=r[j+1].trim()===''?NaN:Number(r[j+1]));if(!valid(x))throw Error(`${i+2}行目の値が不正です`);return x;});if(!confirm(`${added.length}件を追加しますか？`))return;if(persist([...records,...added])){render();$('error').textContent=`${added.length}件読み込みました。`;}}catch(err){$('error').textContent=err.message;}finally{e.target.value='';}};
$('backup').onclick=()=>{const data=storageBlocked&&storageRaw!==null?storageRaw:JSON.stringify({version:1,slug:'profit',records},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='profit-pro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};$('restoreButton').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('バックアップは2MB以下にしてください');const data=JSON.parse(await f.text());if(!data||data.version!==1||data.slug!=='profit')throw Error('この商品のバックアップではありません');const next=validateRecords(data.records);if(!confirm('保存済みの商品をバックアップで置き換えますか？'))return;if(persist(next,true)){editing=null;render();$('error').textContent='復元しました。';}}catch(err){$('error').textContent=err.message;}finally{e.target.value='';}};$('print').onclick=()=>window.print();$('clear').onclick=()=>{if(!records.length)return;if(confirm(`登録した${records.length}件をすべて削除しますか？`)){if(persist([])){editing=null;render();}}};update();render();
</script></body></html>
