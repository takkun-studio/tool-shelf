<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>販売チャネル比較 PRO</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f3f6fb;color:#192b40}header{background:#182e4d;color:#fff;padding:25px max(20px,calc((100vw - 1050px)/2))}main{max-width:1050px;margin:25px auto;padding:0 16px}section{background:white;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #14283a12}h1{margin:0}h2{font-size:19px}label{display:block;font-size:13px;font-weight:600}input{width:100%;padding:11px;border:1px solid #bac6d2;border-radius:8px;font-size:16px;margin-top:6px}button{background:#234f8c;color:white;border:0;border-radius:8px;padding:11px 15px;margin:4px;cursor:pointer}button.secondary{background:#e8edf4;color:#182e4d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#f1f6fc;border-radius:10px;padding:15px}.metric b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.small{font-size:12px;color:#596b80}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left;overflow-wrap:anywhere}tr{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #2357a6;outline-offset:2px}@media print{button,.no-print{display:none!important}body{background:white}section{box-shadow:none}table{table-layout:fixed;width:100%}thead{display:table-header-group}tr{break-inside:avoid}td,th{overflow-wrap:anywhere}}</style></head><body><header><h1>販売チャネル比較 PRO</h1><p>独立買い切り版 | オフライン対応 | データはこの端末に保存</p></header><main><section><h2>計算条件</h2><label>案件・商品名<input id="name" value="サンプル" maxlength="200"></label><div class="grid"><label>A 販売価格<input id="priceA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 商品原価<input id="costA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 送料<input id="shippingA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 販売手数料率 %<input id="salesFeeA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 決済手数料率 %<input id="paymentFeeA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 販売価格<input id="priceB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 商品原価<input id="costB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 送料<input id="shippingB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 販売手数料率 %<input id="salesFeeB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 決済手数料率 %<input id="paymentFeeB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>追加目標利益（円）<input id="goal" type="number" min="0" step="any" value="0"></label></div><p class="small">追加目標の意味は計算結果の項目名に表示。各数値は税・端数処理を含まない概算です。逆算価格は1円単位で切り上げます。</p><p id="error" role="alert" style="color:#a12b34"></p><button id="save">この条件を保存</button><button class="secondary" id="cancelEdit" hidden>編集をやめる</button><button class="secondary" onclick="window.print()">PDF保存・印刷</button></section><section><h2>計算結果</h2><div class="results" id="result"></div></section><section><h2>販売先別の利益比較</h2><p class="small">入力値を変更すると自動更新。比較値は概算です。</p><div style="overflow-x:auto"><table><thead><tr><th>販売先</th><th>利益</th></tr></thead><tbody id="scenario"></tbody></table></div></section><section><h2>保存済みの比較データ</h2><p class="small">行をタップすると条件を再読込。保存データはブラウザごとに管理されます。</p><div class="no-print"><button id="export">CSV出力</button><button class="secondary" id="backup">JSONバックアップ</button><label>JSON復元<input type="file" id="restore" accept=".json,application/json"></label></div><div style="overflow-x:auto"><table><thead><tr><th>名称</th><th>保存日時</th><th>主な結果</th><th class="no-print">操作</th></tr></thead><tbody id="history"></tbody></table></div></section><p class="small">本商品は試算補助ツールです。販売プラットフォームごとの税・手数料の最新規定は別途確認してください。</p></main><script>const F=[["priceA", "A 販売価格"], ["costA", "A 商品原価"], ["shippingA", "A 送料"], ["salesFeeA", "A 販売手数料率 %"], ["paymentFeeA", "A 決済手数料率 %"], ["priceB", "B 販売価格"], ["costB", "B 商品原価"], ["shippingB", "B 送料"], ["salesFeeB", "B 販売手数料率 %"], ["paymentFeeB", "B 決済手数料率 %"]],KEY='tool-shelf-pro-'+"channel",fmt=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:12});const formatNumber=n=>n!==0&&Math.abs(n)<1e-12?n.toExponential():fmt.format(n);let records=[];let editing=null;let storageRaw=null;let storageBlocked=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tooSmall=x=>typeof x==='number'&&x!==0&&Math.abs(x)<1e-100;const safeResult=x=>x===null||typeof x!=='number'||(Number.isFinite(x)&&Math.abs(x)<=Number.MAX_SAFE_INTEGER);// Exact decimal ratios for decision boundaries; persisted inputs remain ordinary numbers.
function Q(x){const [m,e='0']=String(x).toLowerCase().split('e');const neg=m[0]==='-';const t=neg?m.slice(1):m;const [i,f='']=t.split('.');const n=BigInt((i||'0')+f)*(neg?-1n:1n);const p=f.length-Number(e);return p>=0?[n,10n**BigInt(p)]:[n*10n**BigInt(-p),1n]}
const A=(a,b)=>[a[0]*b[1]+b[0]*a[1],a[1]*b[1]],S=(a,b)=>[a[0]*b[1]-b[0]*a[1],a[1]*b[1]],M=(a,b)=>[a[0]*b[0],a[1]*b[1]],R=(a,b)=>b[0]<0n?[-a[0]*b[1],-a[1]*b[0]]:[a[0]*b[1],a[1]*b[0]],C=a=>Number(a[0]>=0n?(a[0]+a[1]-1n)/a[1]:a[0]/a[1]),L=a=>Number(a[0]>=0n?a[0]/a[1]:(a[0]-a[1]+1n)/a[1]),SUM=(...v)=>v.map(Q).reduce(A,Q(0));
function V(a){if(a[0]===0n)return 0;const neg=a[0]<0n,n=neg?-a[0]:a[0],d=a[1],e=n.toString().length-d.toString().length,shift=17-e,scaled=shift>=0?n*10n**BigInt(shift)/d:n/(d*10n**BigInt(-shift));return Number((neg?'-':'')+scaled.toString()+'e'+(-shift))}function decimalPreserved(raw){raw=String(raw);if(raw.length>128)return false;const e=Number((raw.toLowerCase().split('e')[1])||0);if(!Number.isInteger(e)||Math.abs(e)>400)return false;try{return S(Q(raw),Q(Number(raw)))[0]===0n}catch{return false}}function parseBackup(text){for(let i=0;i<text.length;){if(text[i]==='"'){i++;while(i<text.length){if(text[i]==='\\'){i+=2;continue}if(text[i++]==='"')break}continue}if(text[i]==='-'||(text[i]>='0'&&text[i]<='9')){const m=text.slice(i).match(/^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/);if(m){if(!decimalPreserved(m[0]))throw Error('バックアップの数値の精度が扱える範囲を超えています');i+=m[0].length;continue}}i++}return JSON.parse(text)}function compute(v,goal){const net=(price,cost,shipping,sales,payment)=>S(M(Q(price),R(S(Q(100),SUM(sales,payment)),Q(100))),SUM(cost,shipping)),aq=net(v.priceA,v.costA,v.shippingA,v.salesFeeA,v.paymentFeeA),bq=net(v.priceB,v.costB,v.shippingB,v.salesFeeB,v.paymentFeeB),a=V(aq),b=V(bq);return {'A 利益':a,'B 利益':b,'利益差 A-B':V(S(aq,bq)),'A 追加目標利益までの販売件数':goal===0?0:aq[0]>0n?C(R(Q(goal),aq)):null,'B 追加目標利益までの販売件数':goal===0?0:bq[0]>0n?C(R(Q(goal),bq)):null,'有利な販売先':S(aq,bq)[0]===0n?'同額':S(aq,bq)[0]>0n?'A':'B','A 目標利益価格':S(Q(100),SUM(v.salesFeeA,v.paymentFeeA))[0]>0n?C(R(M(SUM(v.costA,v.shippingA,goal),Q(100)),S(Q(100),SUM(v.salesFeeA,v.paymentFeeA)))):null,'B 目標利益価格':S(Q(100),SUM(v.salesFeeB,v.paymentFeeB))[0]>0n?C(R(M(SUM(v.costB,v.shippingB,goal),Q(100)),S(Q(100),SUM(v.salesFeeB,v.paymentFeeB)))):null};}function read(){let v={};for(let [id] of F){let x=$(id).value;if(x===''||!Number.isFinite(Number(x))||Number(x)<0||Number(x)>1e12)throw Error('入力値は0以上の数値で指定してください');v[id]=Number(x);if(!decimalPreserved(x))throw Error('数値の精度が扱える範囲を超えています');if(tooSmall(v[id]))throw Error('0でない数値は1e-100以上で入力してください');if((id.toLowerCase().includes('rate')||id.startsWith('salesFee')||id.startsWith('paymentFee'))&&v[id]>100)throw Error('比率は0〜100%で入力してください')}let goalText=$('goal').value;let goal=Number(goalText);if(goalText===''||!Number.isFinite(goal)||goal<0||goal>1e12)throw Error('追加目標は0以上にしてください');if(!decimalPreserved(goalText))throw Error('目標値の精度が扱える範囲を超えています');if(tooSmall(goal))throw Error('0でない目標値は1e-100以上で入力してください');return {v,goal}}const SCENARIO=v=>{const r=compute(v,0);return [["チャネルA",r["A 利益"]],["チャネルB",r["B 利益"]]]};
function renderScenario(){try{const {v}=read();const rows=SCENARIO(v);$('scenario').innerHTML=rows.map(([a,b])=>'<tr><td>'+esc(typeof a==='number'?formatNumber(a):a)+'</td><td>'+esc(b===null?'計算不能':safeResult(b)?formatNumber(b):'計算範囲外')+'</td></tr>').join('')}catch(e){$('scenario').innerHTML='<tr><td colspan="2">入力値を確認してください</td></tr>'}}
function show(){renderScenario();try{let {v,goal}=read(),r=compute(v,goal);if(!Object.values(r).every(safeResult))throw Error('計算結果が扱える範囲を超えています。入力値を見直してください');$('error').textContent=storageBlocked?'保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください':'';$('result').innerHTML=Object.entries(r).map(([k,x])=>'<div class="metric">'+esc(k)+'<b>'+esc(x===null?'計算不能':typeof x==='number'?formatNumber(x):x)+'</b></div>').join('');return {v,goal,r}}catch(e){$('error').textContent=e.message;$('result').innerHTML='';return null}}function render(){ $('history').innerHTML=records.map((x,i)=>'<tr data-i="'+i+'"><td>'+esc(x.name)+'</td><td>'+esc(x.date)+'</td><td>'+esc(Object.values(x.values).some(tooSmall)||tooSmall(x.goal)?'精度範囲外':Object.values(x.result).filter(y=>typeof y==='number').slice(0,2).map(y=>safeResult(y)?formatNumber(y):'計算範囲外').join(' / '))+'</td><td class="no-print"><button type="button" class="secondary" data-edit="'+i+'" aria-label="'+esc(x.name)+'（'+(i+1)+'件目）を編集">編集</button><button type="button" class="secondary" data-delete="'+i+'" aria-label="'+esc(x.name)+'（'+(i+1)+'件目）を削除">削除</button></td></tr>').join('')}function validateRecords(input){
 if(!Array.isArray(input)||input.length>500)throw Error('記録件数が不正です（最大500件）');
 return input.map((x,i)=>{
 if(!x||typeof x!=='object'||Array.isArray(x)||typeof x.name!=='string'||x.name.length>200||typeof x.date!=='string'||x.date.length>100||!x.values||typeof x.values!=='object'||Array.isArray(x.values))throw Error('記録'+(i+1)+'の形式が不正です');
 let v={};for(const [id] of F){const n=x.values[id];if(typeof n!=='number'||!Number.isFinite(n)||n<0||n>1e12||((id.toLowerCase().includes('rate')||id.startsWith('salesFee')||id.startsWith('paymentFee'))&&n>100))throw Error('記録'+(i+1)+'の数値が不正です');v[id]=n}
 const goal=x.goal;if(typeof goal!=='number'||!Number.isFinite(goal)||goal<0||goal>1e12)throw Error('記録'+(i+1)+'の目標値が不正です');
 return {name:x.name,date:x.date,values:v,goal,result:compute(v,goal)};
 });}
 function persist(next,allowRecovery=false){try{if(storageBlocked&&!allowRecovery)throw Error('保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください');if(localStorage.getItem(KEY)!==storageRaw)throw Error('別の画面でデータが変更されました。再読み込みしてください');const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);storageRaw=raw;records=next;storageBlocked=false;render();return true}catch(e){$('error').textContent=e.message||'保存に失敗しました';return false}}$('save').onclick=()=>{let x=show();if(!x)return;if(editing===null&&records.length>=500){$('error').textContent='保存上限500件です';return}const next=records.slice(),record={name:($('name').value.trim()||'名称未設定').slice(0,200),date:new Date().toLocaleString('ja-JP'),values:x.v,goal:x.goal,result:x.r};if(editing===null)next.push(record);else next[editing]=record;if(persist(next)){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}};$('history').onclick=e=>{let d=e.target.closest('[data-delete]');if(d){e.stopPropagation();if(confirm('この記録を削除しますか？')){if(persist(records.filter((_,i)=>i!==Number(d.dataset.delete)))){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}}return}let tr=e.target.closest('[data-i]');if(tr){editing=Number(tr.dataset.i);let x=records[editing];$('save').textContent='変更を保存';$('cancelEdit').hidden=false;$('name').value=x.name;$('goal').value=x.goal;for(let [id] of F)$(id).value=x.values[id];show();$('name').focus();window.scrollTo({top:0,behavior:'smooth'})}};$('cancelEdit').onclick=()=>{editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true};$('export').onclick=()=>{let rows=[['名称','保存日時',...F.map(x=>x[1]),'追加目標','計算結果JSON'],...records.map(x=>[x.name,x.date,...F.map(f=>x.values[f[0]]),x.goal,JSON.stringify(x.result)])];let csv='﻿'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[\t\r\n ]*[=+@-]/,m=>"'"+m).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download="channel"+'-pro.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('backup').onclick=()=>{let url=URL.createObjectURL(new Blob([storageBlocked&&storageRaw!==null?storageRaw:JSON.stringify({version:1,slug:"channel",records},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download="channel"+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('restore').onchange=async e=>{try{if(!e.target.files?.[0])return;if(e.target.files[0].size>2000000)throw Error('バックアップは2MB以下にしてください');let data=parseBackup(await e.target.files[0].text());if(data.version!==1||data.slug!=="channel"||!Array.isArray(data.records)||data.records.some(x=>!x.values||typeof x.name!=='string'))throw Error('この商品のバックアップではありません');if(!confirm('保存済みの記録をバックアップで置き換えますか？'))return;const next=validateRecords(data.records);if(persist(next,true)){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}}catch(err){alert(err.message)}e.target.value=''};try{storageRaw=localStorage.getItem(KEY);records=validateRecords(JSON.parse(storageRaw===null?'[]':storageRaw))}catch(e){storageBlocked=true;$('error').textContent='保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください'}render();F.forEach(([id])=>$(id).addEventListener('input',show));$('goal').addEventListener('input',show);show();</script></body></html>
