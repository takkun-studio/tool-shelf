name: Reservation dashboard deployed URL QA

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  qa:
    if: github.event.issue.number == 6 && startsWith(github.event.comment.body, '/qa-reservation-dashboard ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reservation-dashboard-preview

      - name: Read target URL
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.comment.body }}"
          target="${target#'/qa-reservation-dashboard '}"
          case "$target" in
            https://*.takkun-tool-shelf.pages.dev) ;;
            *) echo "::error::Unexpected target URL"; exit 1 ;;
          esac
          echo "TARGET_URL=$target" >> "$GITHUB_ENV"

      - name: Verify public HTTP response and exact HTML
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl --fail --location --silent --show-error --max-time 20 -D - "$TARGET_URL" -o /tmp/reservation-live.html)
          printf '%s\n' "$headers" | tr -d '\r' | grep -Ei '^HTTP/|^content-type:'
          printf '%s' "$headers" | tr -d '\r' | grep -Eiq '^content-type: *text/html([; ]|$)'
          grep -Fq '予約・予定管理' /tmp/reservation-live.html
          cmp -s reservation-preview/index.html /tmp/reservation-live.html

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p /tmp/reservation-e2e
          cd /tmp/reservation-e2e
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps

      - name: Verify desktop and mobile UI
        shell: bash
        run: |
          cd /tmp/reservation-e2e
          cat > check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const url = process.env.TARGET_URL;
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };

          async function visible(page, selector) {
            return page.locator(selector).isVisible().catch(() => false);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const profile of [
              { name: 'desktop', viewport: { width: 1440, height: 900 } },
              { name: 'mobile', viewport: { width: 390, height: 844 } },
            ]) {
              const context = await browser.newContext({ viewport: profile.viewport });
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
              await page.locator('#viewTitle').waitFor({ state: 'visible' });

              assert((await page.locator('#viewTitle').textContent()).trim() === '全体管理', profile.name + ': initial view');
              const side = await visible(page, '.side');
              const tabs = await visible(page, '.mobile-tabs');
              if (profile.name === 'desktop') assert(side && !tabs, 'desktop responsive layout');
              else assert(!side && tabs, 'mobile responsive layout');

              await page.locator('[data-view="month"]:visible').first().click();
              assert((await page.locator('#viewTitle').textContent()).trim() === '月間表示', profile.name + ': month');

              await page.locator('[data-view="detail"]:visible').first().click();
              assert((await page.locator('#viewTitle').textContent()).trim() === '詳細表示', profile.name + ': detail');

              await page.locator('[data-view="dashboard"]:visible').first().click();
              await page.locator('#newBtn').click();
              assert(await visible(page, '#editModal.open'), profile.name + ': add modal');

              await page.locator('#editTime').fill('17:00');
              await page.locator('#editEnd').fill('17:30');
              await page.locator('#editName').fill('公開動作確認');
              await page.locator('#editMenu').fill('QA');
              await page.locator('#editForm button[type="submit"]').click();
              await page.getByText('公開動作確認', { exact: false }).first().waitFor({ state: 'visible' });

              await page.locator('[data-edit]:visible', { hasText: '公開動作確認' }).first().click();
              assert(!(await page.locator('#deleteBtn').isHidden()), profile.name + ': edit');

              page.once('dialog', dialog => dialog.accept());
              await page.locator('#deleteBtn').click();
              await page.waitForTimeout(200);
              assert((await page.getByText('公開動作確認', { exact: false }).count()) === 0, profile.name + ': delete');

              await page.screenshot({ path: '/tmp/reservation-' + profile.name + '.png', fullPage: true });
              await context.close();
            }
            await browser.close();
            console.log('PUBLIC_UI_QA=PASS');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node check.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: reservation-dashboard-deployed-qa
          path: |
            /tmp/reservation-desktop.png
            /tmp/reservation-mobile.png
            /tmp/reservation-live.html
          retention-days: 7

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/$GITHUB_REPOSITORY/issues/6/comments" -f body="予約管理プレビュー実URLQA完了。PC/スマホ表示、3タブ、予定追加・編集・削除、HTML一致、Content-Type text/html を確認。\n\n$TARGET_URL\n\n$run_url" >/dev/null
