<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>販売チャネル比較 PRO</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f3f6fb;color:#192b40}header{background:#182e4d;color:#fff;padding:25px max(20px,calc((100vw - 1050px)/2))}main{max-width:1050px;margin:25px auto;padding:0 16px}section{background:white;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #14283a12}h1{margin:0}h2{font-size:19px}label{display:block;font-size:13px;font-weight:600}input{width:100%;padding:11px;border:1px solid #bac6d2;border-radius:8px;font-size:16px;margin-top:6px}button{background:#234f8c;color:white;border:0;border-radius:8px;padding:11px 15px;margin:4px;cursor:pointer}button.secondary{background:#e8edf4;color:#182e4d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#f1f6fc;border-radius:10px;padding:15px}.metric b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.small{font-size:12px;color:#64758a}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}tr{cursor:pointer}@media print{button,.no-print{display:none!important}body{background:white}section{box-shadow:none}}</style></head><body><header><h1>販売チャネル比較 PRO</h1><p>独立買い切り版 | オフライン対応 | データはこの端末に保存</p></header><main><section><h2>計算条件</h2><label>案件・商品名<input id="name" value="サンプル"></label><div class="grid"><label>A 販売価格<input id="priceA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 商品原価<input id="costA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 送料<input id="shippingA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 販売手数料率 %<input id="salesFeeA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>A 決済手数料率 %<input id="paymentFeeA" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 販売価格<input id="priceB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 商品原価<input id="costB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 送料<input id="shippingB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 販売手数料率 %<input id="salesFeeB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>B 決済手数料率 %<input id="paymentFeeB" type="number" min="0" step="any" value="0" inputmode="decimal"></label><label>追加目標利益（円）<input id="goal" type="number" min="0" step="any" value="0"></label></div><p class="small">追加目標の意味は計算結果の項目名に表示。各数値は税・端数処理を含まない概算です。</p><p id="error" role="alert" style="color:#a12b34"></p><button id="save">この条件を保存</button><button class="secondary" id="cancelEdit" hidden>編集をやめる</button><button class="secondary" onclick="window.print()">PDF保存・印刷</button></section><section><h2>計算結果</h2><div class="results" id="result"></div></section><section><h2>販売先別の利益比較</h2><p class="small">入力値を変更すると自動更新。比較値は概算です。</p><div style="overflow-x:auto"><table><thead><tr><th>販売先</th><th>利益</th></tr></thead><tbody id="scenario"></tbody></table></div></section><section><h2>保存済みの比較データ</h2><p class="small">行をタップすると条件を再読込。保存データはブラウザごとに管理されます。</p><div class="no-print"><button id="export">CSV出力</button><button class="secondary" id="backup">JSONバックアップ</button><label>JSON復元<input type="file" id="restore" accept=".json,application/json"></label></div><div style="overflow-x:auto"><table><thead><tr><th>名称</th><th>保存日時</th><th>主な結果</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></section><p class="small">本商品は試算補助ツールです。販売プラットフォームごとの税・手数料の最新規定は別途確認してください。</p></main><script>const F=[["priceA", "A 販売価格"], ["costA", "A 商品原価"], ["shippingA", "A 送料"], ["salesFeeA", "A 販売手数料率 %"], ["paymentFeeA", "A 決済手数料率 %"], ["priceB", "B 販売価格"], ["costB", "B 商品原価"], ["shippingB", "B 送料"], ["salesFeeB", "B 販売手数料率 %"], ["paymentFeeB", "B 決済手数料率 %"]],KEY='tool-shelf-pro-'+"channel",fmt=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2});let records=[];let editing=null;let storageRaw=null;let storageBlocked=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function compute(v,goal){let a=v.priceA*(1-(v.salesFeeA+v.paymentFeeA)/100)-v.costA-v.shippingA,b=v.priceB*(1-(v.salesFeeB+v.paymentFeeB)/100)-v.costB-v.shippingB;return {'A 利益':a,'B 利益':b,'利益差 A-B':a-b,'A 追加目標利益までの販売件数':goal===0?0:a>0?Math.ceil(goal/a):null,'B 追加目標利益までの販売件数':goal===0?0:b>0?Math.ceil(goal/b):null,'有利な販売先':a===b?'同額':a>b?'A':'B','A 目標利益価格':v.salesFeeA+v.paymentFeeA<100?Math.ceil((v.costA+v.shippingA+goal)/(1-(v.salesFeeA+v.paymentFeeA)/100)):null,'B 目標利益価格':v.salesFeeB+v.paymentFeeB<100?Math.ceil((v.costB+v.shippingB+goal)/(1-(v.salesFeeB+v.paymentFeeB)/100)):null};}function read(){let v={};for(let [id] of F){let x=$(id).value;if(x===''||!Number.isFinite(Number(x))||Number(x)<0||Number(x)>1e12)throw Error('入力値は0以上の数値で指定してください');v[id]=Number(x);if((id.toLowerCase().includes('rate')||id.startsWith('salesFee')||id.startsWith('paymentFee'))&&v[id]>100)throw Error('比率は0〜100%で入力してください')}let goalText=$('goal').value;let goal=Number(goalText);if(goalText===''||!Number.isFinite(goal)||goal<0||goal>1e12)throw Error('追加目標は0以上にしてください');return {v,goal}}const SCENARIO=v=>{const a=v.priceA*(1-(v.salesFeeA+v.paymentFeeA)/100)-v.costA-v.shippingA;const b=v.priceB*(1-(v.salesFeeB+v.paymentFeeB)/100)-v.costB-v.shippingB;return [["チャネルA",Math.round(a)],["チャネルB",Math.round(b)]]};
function renderScenario(){try{const {v}=read();const rows=SCENARIO(v);$('scenario').innerHTML=rows.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b===null?'計算不能':fmt.format(b))+'</td></tr>').join('')}catch(e){$('scenario').innerHTML='<tr><td colspan="2">入力値を確認してください</td></tr>'}}
function show(){renderScenario();try{let {v,goal}=read(),r=compute(v,goal);$('error').textContent=storageBlocked?'保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください':'';$('result').innerHTML=Object.entries(r).map(([k,x])=>'<div class="metric">'+esc(k)+'<b>'+esc(x===null?'計算不能':typeof x==='number'?fmt.format(x):x)+'</b></div>').join('');return {v,goal,r}}catch(e){$('error').textContent=e.message;$('result').innerHTML='';return null}}function render(){ $('history').innerHTML=records.map((x,i)=>'<tr data-i="'+i+'"><td>'+esc(x.name)+'</td><td>'+esc(x.date)+'</td><td>'+esc(Object.values(x.result).filter(y=>typeof y==='number').slice(0,2).map(y=>fmt.format(y)).join(' / '))+'</td><td><button type="button" class="secondary" data-delete="'+i+'">削除</button></td></tr>').join('')}function validateRecords(input){
 if(!Array.isArray(input)||input.length>500)throw Error('記録件数が不正です（最大500件）');
 return input.map((x,i)=>{
 if(!x||typeof x!=='object'||Array.isArray(x)||typeof x.name!=='string'||x.name.length>200||typeof x.date!=='string'||x.date.length>100||!x.values||typeof x.values!=='object'||Array.isArray(x.values))throw Error('記録'+(i+1)+'の形式が不正です');
 let v={};for(const [id] of F){const n=x.values[id];if(typeof n!=='number'||!Number.isFinite(n)||n<0||n>1e12||((id.toLowerCase().includes('rate')||id.startsWith('salesFee')||id.startsWith('paymentFee'))&&n>100))throw Error('記録'+(i+1)+'の数値が不正です');v[id]=n}
 const goal=x.goal;if(typeof goal!=='number'||!Number.isFinite(goal)||goal<0||goal>1e12)throw Error('記録'+(i+1)+'の目標値が不正です');
 return {name:x.name,date:x.date,values:v,goal,result:compute(v,goal)};
 });}
 function persist(next,allowRecovery=false){try{if(storageBlocked&&!allowRecovery)throw Error('保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください');if(localStorage.getItem(KEY)!==storageRaw)throw Error('別の画面でデータが変更されました。再読み込みしてください');const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);storageRaw=raw;records=next;storageBlocked=false;render();return true}catch(e){$('error').textContent=e.message||'保存に失敗しました';return false}}$('save').onclick=()=>{let x=show();if(!x)return;if(editing===null&&records.length>=500){$('error').textContent='保存上限500件です';return}const next=records.slice(),record={name:($('name').value.trim()||'名称未設定').slice(0,200),date:new Date().toLocaleString('ja-JP'),values:x.v,goal:x.goal,result:x.r};if(editing===null)next.push(record);else next[editing]=record;if(persist(next)){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}};$('history').onclick=e=>{let d=e.target.closest('[data-delete]');if(d){e.stopPropagation();if(confirm('この記録を削除しますか？')){if(persist(records.filter((_,i)=>i!==Number(d.dataset.delete)))){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}}return}let tr=e.target.closest('[data-i]');if(tr){editing=Number(tr.dataset.i);let x=records[editing];$('save').textContent='変更を保存';$('cancelEdit').hidden=false;$('name').value=x.name;$('goal').value=x.goal;for(let [id] of F)$(id).value=x.values[id];show();window.scrollTo({top:0,behavior:'smooth'})}};$('cancelEdit').onclick=()=>{editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true};$('export').onclick=()=>{let rows=[['名称','保存日時',...F.map(x=>x[1]),'追加目標','計算結果JSON'],...records.map(x=>[x.name,x.date,...F.map(f=>x.values[f[0]]),x.goal,JSON.stringify(x.result)])];let csv='﻿'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/^[\t\r\n ]*[=+@-]/,m=>"'"+m).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download="channel"+'-pro.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('backup').onclick=()=>{let url=URL.createObjectURL(new Blob([storageBlocked&&storageRaw!==null?storageRaw:JSON.stringify({version:1,slug:"channel",records},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download="channel"+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('restore').onchange=async e=>{try{if(!e.target.files?.[0])return;if(e.target.files[0].size>2000000)throw Error('バックアップは2MB以下にしてください');let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||data.slug!=="channel"||!Array.isArray(data.records)||data.records.some(x=>!x.values||typeof x.name!=='string'))throw Error('この商品のバックアップではありません');if(!confirm('保存済みの記録をバックアップで置き換えますか？'))return;const next=validateRecords(data.records);if(persist(next,true)){editing=null;$('save').textContent='この条件を保存';$('cancelEdit').hidden=true}}catch(err){alert(err.message)}e.target.value=''};try{storageRaw=localStorage.getItem(KEY);records=validateRecords(JSON.parse(storageRaw===null?'[]':storageRaw))}catch(e){storageBlocked=true;$('error').textContent='保存データを読み込めません。JSONバックアップで破損データの控えを保存し、以前の正常なJSONバックアップから復元してください'}render();F.forEach(([id])=>$(id).addEventListener('input',show));$('goal').addEventListener('input',show);show();</script></body></html>
